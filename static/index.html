<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOMthing · The SOM community marketplace (classroom demo)</title>
  <meta name="theme-color" content="#00356b" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2300356b'/><text x='50' y='68' font-size='54' text-anchor='middle' font-family='Arial' font-weight='900' fill='%23ffffff'>S</text></svg>" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- SOMbot assistant drawer -->
  <div id="overlay" class="overlay hidden"></div>
  <aside id="drawer" class="drawer" aria-label="SOMbot shopping assistant" aria-hidden="true">
    <div class="drawer-head">
      <div class="bot-badge"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2zM19 2v4M17 4h4"/></svg></div>
      <div class="title">
        <b>SOMbot · AI shopping assistant</b>
        <span class="muted small">Searches real SOMthing listings · gpt-6-luna</span>
      </div>
      <button class="icon-btn" id="chat-reset" title="Start a new conversation" aria-label="New conversation"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.3L3 16M3 21v-5h5"/></svg></button>
      <button class="icon-btn" id="drawer-close" title="Close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <form id="chat-form" autocomplete="off">
        <input type="text" id="chat-input" maxlength="500" placeholder="e.g. Find a desk under $100" aria-label="Message SOMbot" />
        <button class="btn primary" id="chat-send" type="submit">Send</button>
      </form>
      <div class="usage-line" id="budget-label" style="margin-top:8px"></div>
      <div class="budget"><div id="budget-bar" style="width:0%"></div></div>
      <div class="usage-line" style="margin-top:6px">AI answers can make mistakes. Prices and sellers on the cards come straight from the listings.</div>
    </div>
  </aside>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
